version: '3.8'

services:
  # 1. Persistent PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dta_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dta_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dta_bangladesh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dta_user} -d ${POSTGRES_DB:-dta_bangladesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Production Backend API (Auth, Inventory, Authoritative Persistence)
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dta_backend_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dta_user}:${POSTGRES_PASSWORD:-dta_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-dta_bangladesh}
      JWT_SECRET: ${JWT_SECRET:-dta_bangladesh_super_secret_jwt_key_2026}
      SERVER_API_KEY: ${SERVER_API_KEY:-dta_dedicated_server_internal_token_99}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Headless Godot 4 Dedicated Game Server (Authoritative Simulation)
  game-server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    container_name: dta_game_server
    restart: always
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      GAME_PORT: 7777
      MAX_PLAYERS: 16
      PROTOCOL: websocket
      BACKEND_API_URL: http://backend-api:4000
      SERVER_API_KEY: ${SERVER_API_KEY:-dta_dedicated_server_internal_token_99}
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"

  # 4. Nginx Reverse Proxy (COOP/COEP Headers, SSL/TLS, WSS Upgrade)
  nginx:
    image: nginx:alpine
    container_name: dta_nginx
    restart: always
    depends_on:
      - backend-api
      - game-server
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-bc.vartualtutor.com}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../builds/web:/var/www/dta/web:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
    driver: local
