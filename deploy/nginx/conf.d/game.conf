# ==============================================================================
# NGINX PRODUCTION VIRTUAL HOST CONFIGURATION
# Primary Target: bc.vartualtutor.com
# Subdomains:     play.bc.vartualtutor.com, api.bc.vartualtutor.com
# ==============================================================================

# UPSTREAMS
upstream backend_service {
    server backend-api:4000;
    keepalive 32;
}

upstream game_server_service {
    server game-server:7777;
}

# 1. PRIMARY & BROWSER CLIENT (bc.vartualtutor.com, play.bc.vartualtutor.com)
server {
    listen 80;
    listen [::]:80;
    server_name bc.vartualtutor.com play.bc.vartualtutor.com localhost play.localhost;

    root /var/www/dta/web;
    index index.html;

    # Mandatory Headers for Godot 4 WebAssembly & SharedArrayBuffer Multithreading
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cache Wasm and PCK assets efficiently
    location ~* \.(wasm|pck)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Direct WSS WebSocket proxy on primary domain (/game)
    location /game {
        proxy_pass http://game_server_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Direct API proxy on primary domain (/api)
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct Health Check
    location /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client Web Files
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. SUBDOMAIN: BACKEND API & WSS (api.bc.vartualtutor.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.bc.vartualtutor.com api.localhost;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # A. Secure WebSocket Multiplayer Upgrade (/game)
    location /game {
        proxy_pass http://game_server_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    # B. REST API Endpoints (/api and /health)
    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
